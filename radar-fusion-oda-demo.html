<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071925"><title>RADAR Fusion | Oda Pilot Demosu</title><style>
:root{--bg:#061824;--pane:#0d2a3b;--p2:#123749;--line:#275467;--text:#effafb;--muted:#a4c5d0;--mint:#43daca;--gold:#f9cc88}*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden}body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #8cfdeb;outline-offset:3px}header{background:#071925ed;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}.top{max-width:1130px;margin:auto;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:21px;font-weight:900;letter-spacing:1.2px;white-space:nowrap}.brand b{color:var(--mint)}.flag{background:#3a3021;color:var(--gold);border:1px solid #826b43;padding:5px 9px;font-size:11px;font-weight:800;border-radius:999px}main{max-width:1130px;margin:auto;padding:15px 15px 100px;display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px}aside{display:grid;gap:4px;align-content:start;position:sticky;top:73px;height:max-content;padding:11px;border:1px solid var(--line);border-radius:13px;background:#0b2635}aside button{background:transparent;text-align:left;color:var(--muted);border:0;border-radius:9px;padding:11px}aside button.selected,aside button:hover{background:#195363;color:#fff}.panel{background:var(--pane);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px;min-width:0}.hero{background:linear-gradient(110deg,#174858,#0c2b3c);border:1px solid #296876;border-radius:16px;padding:22px;margin-bottom:14px}h1{font-size:clamp(23px,4vw,32px);line-height:1.18;margin:7px 0}h2{font-size:18px;margin:0 0 10px}p{color:var(--muted);margin:8px 0 12px}.eyebrow{font-size:11px;color:var(--mint);font-weight:800;letter-spacing:1.3px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.split{display:grid;grid-template-columns:1fr 1fr;gap:13px}.metric{background:var(--p2);padding:15px;border-radius:12px;border:1px solid var(--line);min-width:0}.metric small{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;color:var(--text);font-size:24px;line-height:1.25;margin:7px 0;font-variant-numeric:tabular-nums}.metric em{color:#9cdbc9;font-size:11px;font-style:normal}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.btn{border:1px solid #41b9ae;background:var(--mint);color:#092a32;border-radius:9px;min-height:44px;padding:10px 16px;font-weight:800}.btn.alt{background:transparent;color:#c5fcf3}.btn:disabled{opacity:.4;cursor:not-allowed}.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 11px}select{background:#194357;border:1px solid #6b929e;border-radius:8px;padding:9px;color:#fff}table{border-collapse:collapse;width:100%;min-width:490px}th,td{border-bottom:1px solid #2b5160;padding:11px 9px;white-space:nowrap;text-align:left}th{font-size:12px;color:#aed0d8}th:not(:first-child),td:not(:first-child){text-align:right}.tableouter{overflow:auto}.note{background:#352c20;border-left:3px solid #e1b668;padding:12px;border-radius:8px;color:#f7d69d;font-size:13px}.badge{display:inline-block;background:#114b46;color:#9ff0dd;padding:4px 9px;border-radius:7px;font-size:12px;font-weight:750}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #285263;padding:13px 0}.row:last-child{border-bottom:0}.bar{display:flex;align-items:center;gap:10px;margin:12px 0}.bar label{width:65px;color:var(--muted)}.track{background:#20495a;flex:1;height:11px;border-radius:12px;overflow:hidden}.track span{display:block;background:linear-gradient(90deg,#1c8f9d,#44d9c9);height:100%;border-radius:12px}.bar strong{width:36px;text-align:right}input[type=range]{width:100%;accent-color:var(--mint);height:35px;touch-action:pan-y}.number{font-size:40px;font-weight:850;letter-spacing:-1px}.footer{font-size:12px;color:#94b2bd;padding:16px 0}#mobile{display:none}ul,ol{padding-left:20px}li{padding-bottom:6px}@media(max-width:750px){main{display:block;padding:11px 10px 100px}aside{display:none}#mobile{display:flex;overflow-x:auto;position:fixed;bottom:0;left:0;right:0;z-index:20;background:#081e2d;border-top:1px solid var(--line);padding:9px 10px calc(10px + env(safe-area-inset-bottom));gap:8px}#mobile button{background:#174152;border:1px solid #3b6170;color:#edf9fa;white-space:nowrap;border-radius:9px;min-height:44px;padding:9px 11px;font-size:12px}#mobile button.selected{background:#2a7778;color:white}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr;gap:0}.metric strong{font-size:21px}.panel{padding:14px}.hero{padding:20px 15px}.top{padding:11px 10px}.brand{font-size:18px}.flag{font-size:10px}}@media print{header,aside,#mobile,.buttons,.chips,.noprint{display:none!important}main{display:block}body{background:#fff;color:#111}.hero,.panel,.metric{background:#fff;color:#111;border-color:#aaa;break-inside:avoid}.metric strong,h1{color:#111}p,th{color:#333}}
</style></head><body><header><div class="top"><div class="brand">RADAR <b>Fusion</b></div><span class="flag">SENTETİK DEMO</span></div></header><main><aside id="aside" aria-label="Demo ekranları"></aside><div><div id="app"><div class="hero"><h1>RADAR Fusion</h1><p>Demo yükleniyor…</p></div></div><div class="footer">Tüm veriler kurgusaldır. Gerçek RADAR Fusion üretim sistemi veya bankacılık kararı değildir.</div></div></main><nav id="mobile" aria-label="Mobil demo ekranları"></nav><script>
(function(){
'use strict';
var names=['Portföy','30 sn Özet','Finansal Analiz','X-Ray','Findeks','Nakit','Senaryo','Komite','Belgeler','Rapor'];
var vals=[
{year:'2023',sales:120,assets:152,ca:82,cl:63,bank:39,recv:32,stocks:26,equity:56},
{year:'2024',sales:157,assets:184,ca:106,cl:77,bank:47,recv:42,stocks:34,equity:67},
{year:'2025',sales:191,assets:223,ca:133,cl:96,bank:65,recv:55,stocks:42,equity:76},
{year:'2026/06',sales:118,assets:247,ca:151,cl:111,bank:76,recv:63,stocks:47,equity:79}];
var page=0,period=3,shock=-10,delay=15;
function n(x){return Number(x).toLocaleString('tr-TR',{maximumFractionDigits:2})}
function metric(label,value,sub){return '<div class="metric"><small>'+label+'</small><strong>'+value+'</strong><em>'+(sub||'Sentetik kaynak')+'</em></div>'}
function metrics(arr){return '<div class="grid">'+arr.join('')+'</div>'}
function hero(title,sub){return '<div class="hero"><div class="eyebrow">RADAR FUSION / ODA PİLOT DEMOSU</div><h1>'+title+'</h1><p>'+sub+'</p></div>'}
function buttons(next){return '<div class="buttons noprint"><button class="btn" data-next="'+next+'">Sonraki ekran →</button><button class="btn alt" data-go="8">Belgeleri gör</button></div>'}
function tbl(rows){return '<div class="panel tableouter"><table><thead><tr><th>Gösterge (mn TL)</th>'+vals.map(function(x){return '<th>'+x.year+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(x){return '<tr><td>'+x[0]+'</td>'+vals.map(function(y){return '<td>'+n(y[x[1]])+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
function bars(key,max){return '<div class="panel">'+vals.map(function(x){return '<div class="bar"><label>'+x.year+'</label><div class="track"><span style="width:'+Math.round(x[key]/max*100)+'%"></span></div><strong>'+n(x[key])+'</strong></div>'}).join('')+'</div>'}
function sc(){return Math.max(0,55*(1+shock/100)-delay*.25)-44}
function card(title,content){return '<div class="panel"><h2>'+title+'</h2>'+content+'</div>'}
var screens=[];
screens[0]=function(){return hero('Finansal sağlığın 30 saniyelik radarı','ATLAS Örnek Tekstil Sanayi A.Ş. · Ticaret ve Sanayi Odası üyeleri için kurgusal pilot senaryo')+metrics([metric('Finansal borç','76 mn TL','2026/06'),metric('Ticari alacak','63 mn TL'),metric('Dönem sayısı','4'),metric('Öncelik','Tahsilat','İzleme al')])+'<div class="split">'+card('Bankacı gözünden', '<p>Satışlar büyürken nakit döngüsü ve borç servisinin birlikte değerlendirilmesi gerekir. Bankacı yalnızca kâr tutarına bakmaz; tahsilat, vade ve kanıt ister.</p><span class="badge">Ek kanıt gerekli</span>')+card('Pilotun iş değeri','<p>İşletme sahibi riskin hangi hesaptan kaynaklandığını ve hangi aksiyonun gerektiğini bir bakışta görür.</p><p>Finansal veriler kurgusal ve yalnızca gösterim amaçlıdır.</p>')+'</div>'+buttons(1)};
screens[1]=function(){var x=vals[period];return hero('30 saniyelik firma özeti','Veriyi seç, riskin arkasındaki finansal nedeni gör.')+'<div class="panel noprint"><label>Dönem: <select id="period">'+vals.map(function(a,i){return '<option value="'+i+'" '+(period===i?'selected':'')+'>'+a.year+'</option>'}).join('')+'</select></label></div>'+metrics([metric('Toplam aktif',n(x.assets)+' mn'),metric('Net satış',n(x.sales)+' mn',period===3?'6 aylık ara dönem':'Yıllık'),metric('Cari oran',n(x.ca/x.cl)+'x'),metric('Finansal borç',n(x.bank)+' mn')])+card('Bankacı yorumu','<p>120 alacakların kalitesi, stok dönüşümü, banka borcunun vadeleri ve ortak borçları aynı finansal resimde incelenir.</p>')+buttons(2)};
screens[2]=function(){return hero('Finansal analiz','Dört dönemli eğilim · 2026/06 satışları yalnızca altı aylıktır.')+tbl([['Satışlar','sales'],['Aktif','assets'],['Dönen varlık','ca'],['Kısa vadeli borç','cl'],['Banka kredisi','bank'],['Ticari alacak','recv'],['Stok','stocks'],['Özkaynak','equity']])+'<div class="split">'+card('Satış eğilimi','<p>2026/06 tutarı tam yıllarla büyüme oranı olarak karşılaştırılmamalıdır.</p>')+bars('bank',80)+'</div>'+buttons(3)};
screens[3]=function(){return hero('Hesap X-Ray','Mizan hesap sınıfları ve riskin kaynağı.')+card('Mizan hesap izleri','<div class="row"><span>120 · Alıcılar</span><b>63 mn TL</b></div><div class="row"><span>320 · Satıcılar</span><b>53 mn TL</b></div><div class="row"><span>300 · Kısa kredi</span><b>38 mn TL</b></div><div class="row"><span>400 · Uzun kredi</span><b>38 mn TL</b></div><div class="row"><span>331 · Kısa ortak borcu</span><b>6 mn TL</b></div><div class="row"><span>431 · Uzun ortak borcu</span><b>10 mn TL</b></div>')+'<div class="note">331 ve 431 birlikte kapsanır; alt hesaplar ile üst hesaplar çift toplanmaz. Gerçek veride sözleşme vadesi de doğrulanmalıdır.</div>'+buttons(4)};
screens[4]=function(){return hero('Findeks benzeri risk özeti','Bu ekran resmî Findeks veya Risk Merkezi verisi içermez.')+metrics([metric('Nakdi risk','76 mn'),metric('Gayrinakdi','14 mn'),metric('Toplam risk','90 mn'),metric('Gecikmiş risk','0 mn','Sentetik varsayım')])+card('Banka dağılımı','<p>Örnek A bankası: 40 mn TL; B bankası: 20 mn TL; C bankası: 16 mn TL.</p><p>Ödeme kabiliyeti, tahsilat vadeleri ve faaliyet nakdi ile birlikte değerlendirilir.</p>')+buttons(5)};
screens[5]=function(){return hero('Nakit dayanıklılık','12 aylık borç servisi ile varsayımsal faaliyet nakdini karşılaştır.')+metrics([metric('Örnek faaliyet nakdi','55 mn'),metric('Anapara ödeme','38 mn'),metric('Faiz ödeme','6 mn'),metric('Örnek tampon','11 mn','55 − 44')])+card('Önemli sınır','<p>Bu, gerçek banka ekstreleriyle doğrulanmış nakit akışı ya da DSCR değildir. Serbest/bloke nakit ve tüm bankaların ödeme planları doğrulanmadan kredi onayı üretilemez.</p>')+buttons(6)};
screens[6]=function(){return hero('Senaryo Laboratuvarı','Nakit ve tahsilat koşulları değişince örnek dayanıklılık anında değişir.')+'<div class="split">'+card('Parametreleri değiştir','<label>Faaliyet nakdi şoku: <b id="shockText">'+shock+'%</b><input aria-label="Faaliyet nakdi şoku" type="range" id="shock" min="-35" max="10" step="5" value="'+shock+'"></label><label>Tahsilat gecikmesi: <b id="delayText">'+delay+' gün</b><input aria-label="Tahsilat gecikmesi" type="range" id="delay" min="0" max="60" step="5" value="'+delay+'"></label><button class="btn alt noprint" id="reset">Parametreleri sıfırla</button>')+card('Örnek net tampon','<div class="number" id="scenarioResult" style="color:'+(sc()<0?'#ffaaa0':'#49dbbc')+'">'+n(sc())+' mn</div><p id="scenarioDesc">'+(sc()<0?'Tahmini nakit açığı':'Pozitif nakit tamponu')+'</p><p>Örnek borç servisi 44 mn TL. Bu sadeleştirilmiş gösterim gerçek MizanIQ motorundan çıkmış bir karar değildir.</p>')+'</div>'+buttons(7)};
screens[7]=function(){return hero('Kredi komitesi için ön değerlendirme','İşletmenin krediye hazırlık durumu ve kanıt zinciri.')+card('Karar önerisi','<span class="badge">İzleme al · ek kanıt topla</span><ol><li>90 gün üzeri alacaklar için tahsilat planı.</li><li>Kısa ve uzun vadeli kredi takvimi mutabakatı.</li><li>Ortak borçlarının 331 / 431 ayrımı.</li><li>Serbest nakit / bloke tutarlarının kontrolü.</li></ol><p>Bağlayıcı kredi tahsis kararı değildir.</p>')+buttons(8)};
screens[8]=function(){return hero('Belge kapsamı','Gerçek müşteri kabulünde istenecek belgelerin örnek listesi.')+card('Sentetik belge seti',['2023, 2024, 2025 ve 2026/06 mizanı','12 aylık kredi ödeme planı','Banka hesap hareketleri','Findeks benzeri risk özeti','Alacak ve satıcı yaşlandırma','Stok ve teminat listesi','Ortaklık, 331 / 431 borç açıklaması','Vergi, döviz pozisyonu ve nakit tahmini'].map(function(x){return '<div class="row"><span>'+x+'</span><span class="badge">Örnek</span></div>'}).join(''))+'<div class="note">Burada gerçek dosya yüklenmez, doğrulama yapılmış gibi gösterilmez ve müşteriye ait veri saklanmaz.</div>'+buttons(9)};
screens[9]=function(){return hero('Finansal sağlık raporu','ATLAS Örnek Tekstil · 2026/06 · SENTETİK RAPOR')+metrics([metric('Aktif','247 mn'),metric('Banka kredisi','76 mn'),metric('Cari oran',n(151/111)+'x'),metric('Alacaklar','63 mn')])+card('Yönetici özeti','<p>İşletmenin banka borcu 76 mn TL, alacakları 63 mn TL seviyesindedir. Tahsilat kalitesi ve ödeme vadeleri birlikte yönetilmelidir.</p><h2>Öncelikli üç aksiyon</h2><ol><li>Gecikmiş alacaklar için tahsilat planı oluştur.</li><li>Kredi vadelerini nakit dönüşümüyle eşleştir.</li><li>Kaynak belgelerle borç servisinin kapsamını doğrula.</li></ol><p>Kesin kredi tahsisi, resmî Findeks raporu veya bağımsız denetim değildir.</p>')+'<div class="buttons noprint"><button class="btn" id="print">Yazdır / PDF</button><button class="btn alt" data-go="0">Başa dön</button></div>'};
function draw(){document.getElementById('app').innerHTML=screens[page]();document.querySelectorAll('[data-nav]').forEach(function(b){b.classList.toggle('selected',Number(b.getAttribute('data-nav'))===page)});window.scrollTo(0,0)}
function go(i){page=Math.max(0,Math.min(9,i));draw()}
function navhtml(){return names.map(function(x,i){return '<button type="button" data-nav="'+i+'">'+x+'</button>'}).join('')}
document.getElementById('aside').innerHTML=navhtml();document.getElementById('mobile').innerHTML=navhtml();
document.addEventListener('click',function(e){var t=e.target.closest('[data-nav],[data-go],[data-next],#reset,#print');if(!t)return;if(t.hasAttribute('data-nav'))go(Number(t.getAttribute('data-nav')));else if(t.hasAttribute('data-go'))go(Number(t.getAttribute('data-go')));else if(t.hasAttribute('data-next'))go(Number(t.getAttribute('data-next')));else if(t.id==='reset'){shock=0;delay=0;draw()}else if(t.id==='print')window.print()});
document.addEventListener('change',function(e){if(e.target.id==='period'){period=Number(e.target.value);draw()}});
document.addEventListener('input',function(e){if(e.target.id!=='shock'&&e.target.id!=='delay')return;if(e.target.id==='shock')shock=Number(e.target.value);else delay=Number(e.target.value);document.getElementById('shockText').textContent=shock+'%';document.getElementById('delayText').textContent=delay+' gün';var r=sc(),res=document.getElementById('scenarioResult');res.textContent=n(r)+' mn';res.style.color=r<0?'#ffaaa0':'#49dbbc';document.getElementById('scenarioDesc').textContent=r<0?'Tahmini nakit açığı':'Pozitif nakit tamponu'});
draw();
})();</script></body></html>
